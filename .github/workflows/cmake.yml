name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Tangle is temporarily pinned to the fork that carries the library options
  # and boundary-match API. Revert both values to dcm3c/tangle and the merged
  # upstream commit once those changes are upstreamed.
  XFEMM_TANGLE_REPOSITORY: https://github.com/crobarcro/tangle.git
  XFEMM_TANGLE_REVISION: b5d51ad8639526a83576b42aee5ce1ef82d96e9b

jobs:
  build:
    name: CMake (${{ matrix.mesher-backend }})
    # Pin the runner image so compiler/OS upgrades do not silently change
    # numerical behaviour or expose unrelated mesher regressions in PR checks.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mesher-backend: [Triangle, Tangle]

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/help/latest/variable/CMAKE_BUILD_TYPE.html
      run: |
        cd cfemm
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DXFEMM_MESHER_BACKEND=${{matrix.mesher-backend}} \
          -DXFEMM_TANGLE_REPOSITORY=${{env.XFEMM_TANGLE_REPOSITORY}} \
          -DXFEMM_TANGLE_REVISION=${{env.XFEMM_TANGLE_REVISION}}

    - name: Verify the pinned Tangle revision
      run: |
        fetched=$(git -C "${{github.workspace}}/build/_deps/tangle_upstream-src" rev-parse HEAD)
        if [ "$fetched" != "${{env.XFEMM_TANGLE_REVISION}}" ]; then
          echo "Fetched Tangle $fetched, expected ${{env.XFEMM_TANGLE_REVISION}}"
          exit 1
        fi

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --timeout 300 --output-on-failure

  sanitizers:
    name: Address/UB sanitizers
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXFEMM_ENABLE_SANITIZERS=ON \
          -DXFEMM_TANGLE_REPOSITORY=${{env.XFEMM_TANGLE_REPOSITORY}} \
          -DXFEMM_TANGLE_REVISION=${{env.XFEMM_TANGLE_REVISION}} \
          cfemm
    - name: Build the materializer and native view unit tests
      run: >
        cmake --build ${{github.workspace}}/build
        --target instanced_mesh_test instanced_mesh_hash_test
        instanced_mesh_airgap_test instanced_mesh_sector_test
        logical_mesh_view_test -j2
    - name: Run the materializer and native view unit tests under sanitizers
      working-directory: ${{github.workspace}}/build
      run: ctest -R "instanced_mesh|logical_mesh_view" --output-on-failure

  petsc:
    name: PETSc linear solver backend
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install PETSc (complex)
      run: sudo apt-get update && sudo apt-get install -y libpetsc-complex-dev
    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DXFEMM_USE_PETSc=ON
        -DXFEMM_TANGLE_REPOSITORY=${{env.XFEMM_TANGLE_REPOSITORY}}
        -DXFEMM_TANGLE_REVISION=${{env.XFEMM_TANGLE_REVISION}}
        cfemm
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j2
    - name: Test with the legacy backend (default)
      id: legacy_tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --timeout 300 --output-on-failure
    - name: Test with the PETSc backend
      # The machine comparison deliberately fails on meaningful legacy-model
      # discrepancies. Still run PETSc against the same fixtures so its own
      # convergence failures are independently visible in this job.
      if: ${{ success() || (failure() && steps.legacy_tests.outcome == 'failure') }}
      working-directory: ${{github.workspace}}/build
      run: XFEMM_SOLVER_BACKEND=petsc ctest -C ${{env.BUILD_TYPE}} --timeout 300 --output-on-failure

  octave-mex:
    name: GNU Octave MEX interface    
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install GNU Octave toolchain
      run: sudo apt-get update && sudo apt-get install -y octave octave-dev
    - name: Build and test the MEX interfaces
      run: >-
        octave --no-gui --quiet --eval
        "addpath(fullfile(pwd, 'mfemm')); mfemm_setup('ForceMexRecompile', true,
        'RunTests', true, 'Clean', true, 'Tidy', true);
        addpath(fullfile(pwd, 'mfemm', 'testing'));
        addpath(fullfile(pwd, 'mfemm', 'testing', 'radial_machine'));
        Test_femmsession;
        Test_femmsession_instanced;
        Test_radial_machine_sliding_vs_redraw;"

  python:
    name: Python interface
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build Python extension
      run: python -m pip install -e 'python[test]'
    - name: Test Python interface
      run: python -m pytest python/tests -q

  matlab-mex:
    name: MATLAB MEX interface
    # Pin the OS and MATLAB release as a supported MEX compiler pair. The
    # ubuntu-latest image moved to Ubuntu 24.04/GCC 13, which is not supported
    # by the MATLAB release used by this project.
    runs-on: ubuntu-22.04
    # Ordinarily the whole job completes in a few minutes; fail promptly if
    # MATLAB stalls so a PR is not blocked until the default 6-hour limit.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: matlab-actions/setup-matlab@v2
      with:
        release: R2024b
    - name: Build the session wrapper
      timeout-minutes: 12
      uses: matlab-actions/run-command@v2
      with:
        command: >-
          addpath(fullfile(pwd, 'mfemm'));
          mfemm_setup('ForceMexRecompile', true, 'RunTests', false,
          'Clean', true, 'Tidy', true, 'SessionOnly', true);
    # Run each MATLAB test in a separate action step. In the event of a
    # MATLAB/MEX hang, the failing test is visible rather than hiding both
    # tests behind one long-running "Test the session wrapper" step.
    - name: Test FEMM session wrapper
      timeout-minutes: 5
      uses: matlab-actions/run-command@v2
      with:
        command: >-
          addpath(fullfile(pwd, 'mfemm'));
          mfemm_setup('SessionOnly', true);
          fprintf('START Test_femmsession\n');
          Test_femmsession;
          fprintf('PASS Test_femmsession\n');
    - name: Test instanced FEMM session wrapper
      timeout-minutes: 5
      uses: matlab-actions/run-command@v2
      with:
        command: >-
          addpath(fullfile(pwd, 'mfemm'));
          mfemm_setup('SessionOnly', true);
          fprintf('START Test_femmsession_instanced\n');
          Test_femmsession_instanced;
          fprintf('PASS Test_femmsession_instanced\n');
