name: CMake

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: CMake (${{ matrix.mesher-backend }})
    # Pin the runner image so compiler/OS upgrades do not silently change
    # numerical behaviour or expose unrelated mesher regressions in PR checks.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mesher-backend: [Triangle, Tangle]

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/help/latest/variable/CMAKE_BUILD_TYPE.html
      run: |
        cd cfemm
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DXFEMM_MESHER_BACKEND=${{matrix.mesher-backend}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --timeout 60 --output-on-failure

  petsc:
    name: PETSc linear solver backend
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install PETSc (complex)
      run: sudo apt-get update && sudo apt-get install -y libpetsc-complex-dev
    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DXFEMM_USE_PETSc=ON
        cfemm
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j2
    - name: Test with the legacy backend (default)
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --timeout 60 --output-on-failure
    - name: Test with the PETSc backend
      working-directory: ${{github.workspace}}/build
      run: XFEMM_SOLVER_BACKEND=petsc ctest -C ${{env.BUILD_TYPE}} --timeout 60 --output-on-failure

  octave-mex:
    name: GNU Octave MEX interface    
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install GNU Octave toolchain
      run: sudo apt-get update && sudo apt-get install -y octave octave-dev
    - name: Build and test the MEX interfaces
      run: >-
        octave --no-gui --quiet --eval
        "addpath(fullfile(pwd, 'mfemm')); mfemm_setup('ForceMexRecompile', true,
        'RunTests', true, 'Clean', true, 'Tidy', true);
        Test_femmsession;"

  python:
    name: Python interface
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build Python extension
      run: python -m pip install -e 'python[test]'
    - name: Test Python interface
      run: python -m pytest python/tests -q

  matlab-mex:
    name: MATLAB MEX interface
    # Pin the OS and MATLAB release as a supported MEX compiler pair. The
    # ubuntu-latest image moved to Ubuntu 24.04/GCC 13, which is not supported
    # by the MATLAB release used by this project.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: matlab-actions/setup-matlab@v2
      with:
        release: R2024b
    - name: Build the session wrapper
      uses: matlab-actions/run-command@v2
      with:
        command: >-
          addpath(fullfile(pwd, 'mfemm'));
          mfemm_setup('ForceMexRecompile', true, 'RunTests', false,
          'Clean', true, 'Tidy', true, 'SessionOnly', true);
    - name: Test the session wrapper
      uses: matlab-actions/run-command@v2
      with:
        command: >-
          addpath(fullfile(pwd, 'mfemm'));
          mfemm_setup('SessionOnly', true);
          Test_femmsession;
