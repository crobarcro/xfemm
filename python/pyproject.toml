[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "xfemm"
version = "0.1.0.dev0"
description = "Stateful Python interface to the xfemm magnetic finite-element solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.packages = ["src/xfemm"]
build-dir = "build/{wheel_tag}"

